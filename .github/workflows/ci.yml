name: DarkCall CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test server starts
      run: |
        timeout 10 python server.py || true

    - name: Build Docker image
      run: docker build -t darkcall .

    - name: Run Docker container
      run: |
        docker run -d --name darkcall-test -p 8765:8765 darkcall
        sleep 5
        curl -f http://localhost:8765/ || exit 1
        docker stop darkcall-test
